# Thème calé sur la palette du dashboard (voir le bloc CSS de app.py pour le
# détail des tokens). Les deux modes sont déclarés explicitement : Streamlit
# garde son sélecteur clair/sombre natif (réglage système par défaut), les
# deux variantes restent cohérentes avec la marque plutôt que ses couleurs
# génériques par défaut.

[theme]
font = "sans serif"

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#fcfcfb"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"

[theme.light.sidebar]
backgroundColor = "#fcfcfb"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#ffffff"
borderColor = "#2c2c2a"

[theme.dark.sidebar]
backgroundColor = "#1a1a19"
